<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101016"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2A24A"/>
      <stop offset="55%" stop-color="#E8913A"/>
      <stop offset="100%" stop-color="#C76A28"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB867" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#E8913A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer dark frame -->
  <path d="M256 56 L456 256 L256 456 L56 256 Z"
        fill="#0B0B10" stroke="#1E1E2A" stroke-width="6" stroke-linejoin="round"/>
  <!-- Inner saffron diamond -->
  <path d="M256 96 L416 256 L256 416 L96 256 Z"
        fill="url(#diamond)" stroke="#7A3F12" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bevel highlight overlay -->
  <path d="M256 96 L416 256 L256 416 L96 256 Z" fill="url(#bevel)"/>
  <!-- Subtle inner edge -->
  <path d="M256 128 L384 256 L256 384 L128 256 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" stroke-linejoin="round"/>
</svg>
